name: Deploy Diezell a Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original site
        uses: actions/checkout@v4

      - name: Build the existing published site unchanged
        run: |
          set -e
          mkdir -p site
          unzip -o -q parte-1.zip -d site
          unzip -o -q parte-2.zip -d site
          unzip -o -q parte-3.zip -d site

      - name: Create independent design preview under /preview/
        run: |
          set -e
          # Preserve every existing root file; copy the site to /preview/
          # without recursively copying the new preview directory.
          mkdir -p site/preview
          find site -mindepth 1 -maxdepth 1 ! -name preview -exec cp -a '{}' site/preview/ \;

          # Overlay only the reviewed sources from the isolated design branch.
          # Changes do NOT affect the original site files at the root.
          git fetch --depth=1 origin chatgpt/experiencia-musical-ux
          for file in escuchar.html styles.css app.js music-catalog.js; do
            git show "FETCH_HEAD:$file" > "site/preview/$file"
          done

      - name: Add independent mobile-first concept at /nuevo/
        run: |
          set -e
          mkdir -p site/nuevo
          git fetch --depth=1 origin chatgpt/direccion-visual-material-editorial
          git show "FETCH_HEAD:conceptos/editorial-material/index.html" > site/nuevo/index.html
          # The source lives two directories deep, but the published preview
          # lives one directory below the website root.
          sed -i 's|../../|../|g' site/nuevo/index.html
          test -s site/nuevo/index.html
          test -f site/images/en-vivo-insania.jpg
          test -f site/images/insania.jpg
          test -f site/images/caotico.jpg
          test -f site/images/en-vivo-monterrey.jpg
          grep -q 'class="quick"' site/nuevo/index.html
          grep -q 'class="menu-btn"' site/nuevo/index.html

      - name: Verify original and preview stay separate
        run: |
          set -e
          node --check site/preview/app.js
          node --check site/preview/music-catalog.js
          test -f site/index.html
          test -f site/escuchar.html
          test -f site/preview/index.html
          test -f site/preview/escuchar.html
          test -f site/preview/audio/playlist.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path("site")
          old=(base/"escuchar.html").read_bytes()
          new=(base/"preview"/"escuchar.html").read_bytes()
          assert old!=new, "Preview must be different from original"
          assert b'music-catalog.js' not in old, "Original must remain unchanged"
          assert b'music-catalog.js' in new, "Preview must include redesigned music catalog"
          assert new.count(b'id="dz-player"') == 1, "Only one primary player in preview"
          assert b'open.spotify.com/embed/' not in new, "Do not duplicate Spotify players"
          tracks=set(re.findall(rb'href="(canciones/[^"]+\.html)"',new))
          assert len(tracks)==27, f"Expected 27 unique song detail links, got {len(tracks)}"
          for path in tracks:
            assert (base/"preview"/path.decode()).is_file(), f"Missing song page: {path}"
          print("Original preserved; preview sources and song links checked")
          PY

      - name: Upload both original and preview to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish Pages (original at root, redesign only at /preview/)
        uses: actions/deploy-pages@v4
