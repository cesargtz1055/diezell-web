name: Deploy Diezell a Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original site
        uses: actions/checkout@v4

      - name: Build the existing published site unchanged
        run: |
          set -e
          mkdir -p site
          unzip -o -q parte-1.zip -d site
          unzip -o -q parte-2.zip -d site
          unzip -o -q parte-3.zip -d site

      - name: Create independent design preview under /preview/
        run: |
          set -e
          # Preserve every existing root file; copy the site to /preview/
          # without recursively copying the new preview directory.
          mkdir -p site/preview
          find site -mindepth 1 -maxdepth 1 ! -name preview -exec cp -a '{}' site/preview/ \;

          # Overlay only the reviewed sources from the isolated design branch.
          # Changes do NOT affect the original site files at the root.
          git fetch --depth=1 origin chatgpt/experiencia-musical-ux
          for file in escuchar.html styles.css app.js music-catalog.js; do
            git show "FETCH_HEAD:$file" > "site/preview/$file"
          done

      - name: Build complete modernized site at /nuevo/ without changing originals
        run: |
          set -e
          # Copy original files without recursively copying existing previews.
          mkdir -p site/nuevo
          find site -mindepth 1 -maxdepth 1 ! -name preview ! -name nuevo -exec cp -a '{}' site/nuevo/ \;
          git fetch --depth=1 origin chatgpt/direccion-visual-material-editorial
          git show "FETCH_HEAD:conceptos/editorial-material/index.html" > site/nuevo/index.html
          git show "FETCH_HEAD:conceptos/editorial-material/site-modern.css" > site/nuevo/site-modern.css
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          root=Path('site/nuevo')
          css=root/'site-modern.css'
          assert css.is_file()
          count=0
          for page in root.rglob('*.html'):
              if page==root/'index.html':
                  continue
              text=page.read_text(encoding='utf-8')
              if '</head>' not in text.lower():
                  continue
              rel='../'*len(page.relative_to(root).parts[:-1])
              tag=f'<link rel="stylesheet" href="{rel}site-modern.css">'
              import re
              text=re.sub(r'</head>',lambda _:tag+chr(10)+'</head>',text,count=1,flags=re.I)
              page.write_text(text,encoding='utf-8')
              count+=1
          print('Modernized existing HTML pages:',count)
          assert count>=30, 'Expected full site, not homepage only'
          PY
          git show "FETCH_HEAD:conceptos/editorial-material/editorial-pass.py" > /tmp/diezell-editorial-pass.py
          python3 /tmp/diezell-editorial-pass.py
          # Rebuild Music from an independent document, not a legacy CSS overlay.
          git show "FETCH_HEAD:conceptos/editorial-material/pages/escuchar.html" > site/nuevo/escuchar.html
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-rebuild.css" > site/nuevo/dz-rebuild.css
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-rebuild.js" > site/nuevo/dz-rebuild.js
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          original=Path('site/escuchar.html').read_text(encoding='utf-8')
          albums=re.findall(r'<a class="track-titulo" href="([^"]+)"',original)
          singles=re.findall(r'<a class="sencillo-card" href="([^"]+)"',original)
          links=list(dict.fromkeys(albums+singles))
          assert len(albums)==21 and len(links)==27, f'Unexpected catalog: {len(albums)} album tracks, {len(links)} unique songs'
          assert all((Path('site/nuevo')/path).is_file() for path in links), 'Song detail page missing'
          Path('site/nuevo/dz3-links.js').write_text('window.DZ3_LINKS='+json.dumps(links,ensure_ascii=False)+';',encoding='utf-8')
          print('Rebuilt Music with',len(links),'linked song pages')
          PY
          # Rebuild En vivo as a real page: chronology, gallery and contextual video.
          git show "FETCH_HEAD:conceptos/editorial-material/pages/en-vivo.html" > site/nuevo/en-vivo.html
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-live.css" > site/nuevo/dz-live.css
          git show "FETCH_HEAD:conceptos/editorial-material/pages/build-live.py" > /tmp/diezell-build-live.py
          python3 -m py_compile /tmp/diezell-build-live.py
          python3 /tmp/diezell-build-live.py
          # Rebuild Banda from complete source data, preserving primary references.
          git show "FETCH_HEAD:conceptos/editorial-material/pages/banda.html" > site/nuevo/banda.html
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-band.css" > site/nuevo/dz-band.css
          git show "FETCH_HEAD:conceptos/editorial-material/pages/build-band.py" > /tmp/diezell-build-band.py
          python3 /tmp/diezell-build-band.py
          # Rebuild Caóticos independently, without reusing legacy markup.
          git show "FETCH_HEAD:conceptos/editorial-material/pages/caoticos.html" > site/nuevo/caoticos.html
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-community.css" > site/nuevo/dz-community.css
          # Rebuild stats view, retaining its sourced ledger processing code.
          git show "FETCH_HEAD:conceptos/editorial-material/pages/crecimiento.html" > site/nuevo/crecimiento.html
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-stats.css" > site/nuevo/dz-stats.css
          git show "FETCH_HEAD:conceptos/editorial-material/pages/build-stats.py" > /tmp/diezell-build-stats.py
          python3 /tmp/diezell-build-stats.py
          node --check site/nuevo/dz-stats-engine.js
          # Rebuild each song detail from its own source record, without old layout.
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-song.css" > site/nuevo/dz-song.css
          git show "FETCH_HEAD:conceptos/editorial-material/pages/build-songs.py" > /tmp/diezell-build-songs.py
          python3 /tmp/diezell-build-songs.py
          # Rebuild the four individual member pages and preserve their biographies.
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-member.css" > site/nuevo/dz-member.css
          git show "FETCH_HEAD:conceptos/editorial-material/pages/build-members.py" > /tmp/diezell-build-members.py
          python3 /tmp/diezell-build-members.py
          # Restore original high-value controls across the complete redesign.
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-dock.css" > site/nuevo/dz-dock.css
          git show "FETCH_HEAD:conceptos/editorial-material/pages/dz-dock.js" > site/nuevo/dz-dock.js
          git show "FETCH_HEAD:conceptos/editorial-material/pages/restore-experience.py" > /tmp/diezell-restore-experience.py
          python3 /tmp/diezell-restore-experience.py
          node --check site/nuevo/app.js
          node --check site/nuevo/dz-dock.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path('site/nuevo')
          music=(root/'escuchar.html').read_text(encoding='utf-8')
          assert music.count('id="dz-player"')==1
          assert music.count('id="dz-audio"')==1
          assert music.count('id="dz3-player-sheet"')==1 and music.count('class="dz3-album-embed"')==2
          assert music.count('id="reproductor"')==1
          assert music.find('id="reproductor"') < music.find('id="album-insania"'), 'Primary player must be visible before long catalog'
          assert 'dz3-music' in music and 'dz-rebuild.css' in music
          live=(root/'en-vivo.html').read_text(encoding='utf-8')
          assert 'dz3-live' in live and 'dz-live.css' in live
          assert live.count('class="dz3-photo"')==10, 'All ten photographs from the archive must survive'
          assert live.count('class="dz3-tour-date')==10
          assert live.count('class="dz3-photo-credit"')>=10, 'All archived photographs need credit details'
          assert all('id="'+anchor+'"' in live for anchor in ('foto-monterrey','foto-tims','ultimo-show'))
          band=(root/'banda.html').read_text(encoding='utf-8')
          assert 'dz3-band' in band and 'dz-band.css' in band
          for slug in ('rene','bernie','emmash','mau'):
              assert 'miembro-'+slug+'.html' in band
          assert band.count('class="dz3-member"')==4
          assert band.count('<time>')>=7
          stats=(root/'crecimiento.html').read_text(encoding='utf-8')
          assert 'dz3-stats' in stats and 'dz-stats-engine.js' in stats
          assert 'id="archivo-spotify"' in stats, 'Preserve useful v2 city and song rankings'
          for slug in ('rene','bernie','emmash','mau'):
              member=(root/('miembro-'+slug+'.html')).read_text(encoding='utf-8')
              assert 'dz3-member-page' in member and 'dz-member.css' in member
              assert member.count('<h1>')==1 and 'stripes' not in member
          assert (root/'dz-stats-engine.js').is_file()
          engine=(root/'app.js').read_text(encoding='utf-8')
          assert 'PREVIEW_LIMIT_SECONDS = 90' in engine
          assert "enlazar('dock-prev'" in engine
          songpages=list((root/'canciones').glob('*.html'))
          assert len(songpages)==27
          for song in songpages:
              html= song.read_text(encoding='utf-8')
              assert 'dz3-song' in html and 'dz-song.css' in html, str(song)
              assert html.count('id="dz-player"')==1 and html.count('id="dz-audio"')==1, str(song)
              assert html.count('id="dz3-player-sheet"')==1, str(song)
              assert 'dz3-song-tracklist' in html, str(song)
              assert 'id="dz3-sheet-play"' in html and 'id="dock-ir"' in html, str(song)
              assert 'class="stripes"' not in html, str(song)
              assert '#titulo-sencillos' not in html, str(song)
          home=(root/'index.html').read_text(encoding='utf-8')
          assert 'Prototipo visual.' not in home
          assert 'Diezell en cifras' in home
          assert 'id="momentos"' in home and 'en-vivo.html#foto-tims' in home
          assert 'Unirme a los Caóticos' not in home
          caoticos=(root/'caoticos.html').read_text(encoding='utf-8')
          assert 'Unirme en Instagram' not in caoticos
          assert 'dz3-community' in caoticos and 'id="comunidades-title"' in caoticos
          pages=list(root.rglob('*.html'))
          assert len(pages)>=35
          assert len(pages)==37
          for page in pages:
              body=page.read_text(encoding='utf-8')
              assert body.count('id="dz-dock"')==1 and body.count('id="dz-audio"')==1, str(page)
              assert body.count('id="dz3-player-sheet"')==1 and 'dz3-tabbar' in body, str(page)
          for page in pages:
              text=page.read_text(encoding='utf-8')
              assert ('site-modern.css' in text or page in (root/'index.html',root/'escuchar.html',root/'en-vivo.html',root/'banda.html',root/'caoticos.html',root/'crecimiento.html') or page.parent.name=='canciones' or page.name.startswith('miembro-')), str(page)
              assert '</html>' in text.lower(), str(page)
          print('PASS: editorial structure, player uniqueness, archive navigation,',len(pages),'HTML pages')
          PY
          test -f site/nuevo/escuchar.html
          test -f site/nuevo/en-vivo.html
          test -f site/nuevo/banda.html
          test -f site/nuevo/caoticos.html
          test -f site/nuevo/images/en-vivo-insania.jpg
          test -f site/nuevo/audio/playlist.json
          test -s site/nuevo/dz3-links.js
          node --check site/nuevo/dz-rebuild.js
          node --check site/nuevo/dz3-links.js
          git show "FETCH_HEAD:conceptos/editorial-material/pages/qa-site.py" > /tmp/diezell-qa-site.py
          python3 /tmp/diezell-qa-site.py
          grep -q 'dz-rebuild.css' site/nuevo/escuchar.html
          grep -q 'class="quick"' site/nuevo/index.html

      - name: Verify original and preview stay separate
        run: |
          set -e
          node --check site/preview/app.js
          node --check site/preview/music-catalog.js
          test -f site/index.html
          test -f site/escuchar.html
          test -f site/preview/index.html
          test -f site/preview/escuchar.html
          test -f site/preview/audio/playlist.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path("site")
          old=(base/"escuchar.html").read_bytes()
          new=(base/"preview"/"escuchar.html").read_bytes()
          assert old!=new, "Preview must be different from original"
          assert b'music-catalog.js' not in old, "Original must remain unchanged"
          assert b'music-catalog.js' in new, "Preview must include redesigned music catalog"
          assert new.count(b'id="dz-player"') == 1, "Only one primary player in preview"
          assert b'open.spotify.com/embed/' not in new, "Do not duplicate Spotify players"
          tracks=set(re.findall(rb'href="(canciones/[^"]+\.html)"',new))
          assert len(tracks)==27, f"Expected 27 unique song detail links, got {len(tracks)}"
          for path in tracks:
            assert (base/"preview"/path.decode()).is_file(), f"Missing song page: {path}"
          print("Original preserved; preview sources and song links checked")
          PY

      - name: Upload original, music preview and complete redesign to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Wait for exactly one Pages artifact to become visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for attempt in $(seq 1 24); do
            count=$(curl -fsSL --retry 2 --retry-delay 1 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" \
              | python3 -c 'import json,sys; print(len([a for a in json.load(sys.stdin).get("artifacts",[]) if a.get("name")=="github-pages"]))') || count=0
            echo "Pages artifact count: $count"
            if [ "$count" = "1" ]; then
              sleep 5
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "Duplicate artifacts. A clean new run is required."
              exit 1
            fi
            sleep 5
          done
          echo "Pages artifact did not become available."
          exit 1

      - name: Publish Pages (original at root, new design at /nuevo/)
        uses: actions/deploy-pages@v4
